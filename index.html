<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Materiais</title>
  <style>
    body {
      background-color: #c0bcbc;
      margin: 0;
      font-family: 'Brush Script MT', cursive;
    }

    .white-bar {
      height: 10px;
      background-color: white;
    }

    h1, h2 {
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    
    .produtos {
      max-width: 1000px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .produto {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .produto img {
      width: 100%;
      border-radius: 10px;
    }

    .produto h3 {
      margin: 10px 0 5px;
    }

    .produto p {
      margin: 5px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="white-bar"></div>
  <h1>Loja De Materiais</h1>
<form>
   <h2>Products</h2>
   <div class="produtos">
     <div class="search-container">
     <form>
       <input type="search" id="search" name="q" placeholder="O que você procura?">
        <button type="submit" class="search-button">
         <i class="fas fa-search"></i> <!-- Exemplo de ícone de lupa -->
        </button>
     </form>
    </div>

  <button>
     <div class="produto">
       <img src="https://preview.redd.it/rips-shirt-open-like-that-werewolf-meme-i-did-it-v0-f96l6skpzymf1.jpeg?width=750&auto=webp&s=480822a2abe09c87c11c8a727df9237545f12c4f" alt="Produto 1">
       <h3>Lápis Escolar</h3>
       <p>Descrição: Lápis para material escolar </p>
       <p>Preço: R$1,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://via.placeholder.com/200" alt="Produto 2">
       <h3>Caderno Pequeno</h3>
       <p>Descrição: Caderno pautado com 67 páginas 140x200mm</p>
       <p>Preço: 14,90</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://via.placeholder.com/200" alt="Produto 3">
       <h3>Caderno de Artes</h3>
       <p>Descrição: Caderno sem pauta para artes escolar</p>
       <p>Preço: 29,90</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://via.placeholder.com/200" alt="Produto 4">
       <h3>Borracha</h3>
       <p>Descrição: Borracha branca </p>
       <p>Preço: 5,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://via.placeholder.com/200" alt="Produto 5">
       <h3>Folha Papel A4 </h3>
       <p>Descrição: 50 Unidades folha branca papel A4</p>
       <p>Preço: 35,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://via.placeholder.com/200" alt="Produto 6">
       <h3>Corretivo Líquido</h3>
       <p>Descrição: Corretivo líquido 18 ml</p>
       <p>Preço: 9,99</p>
     </div>
  </button>
  <button>
    <div class="produto">
      <img src="https://via.placeholder.com/200" alt="Produto 7">
      <h3>Corretivo em Fita</h3>
      <p>Descrição: Corretivo Fita 5m x 5mm</p>
      <p>Preço: 11,99</p>
    </div>
  </button>
  <button>
    <div class="produto">
        <img src="https://i.pinimg.com/736x/27/78/f8/2778f8811358151314ec5366fd6e766d.jpg" alt="produto 8">
      <h3>Bert Sanpsums</h3>
      <p>Descrição: Ultra raro</p>
      <p>Preço: R$9,999,999,999,999,00</p>
    </div>
  </button>   
</form>
</body>
</html>
