<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja de Materiais</title>
  <style>
    body {
      background-color: #c0bcbc;
      margin: 0;
      font-family: 'Brush Script MT', cursive;
    }

    .white-bar {
      height: 10px;
      background-color: white;
    }

    h1, h2 {
      text-align: center;
    }

    form {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    
    .produtos {
      max-width: 1000px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .produto {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .produto img {
      width: 100%;
      border-radius: 10px;
    }

    .produto h3 {
      margin: 10px 0 5px;
    }

    .produto p {
      margin: 5px 0;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="white-bar"></div>
  <h1>Loja De Materiais</h1>
  </div>
  <button>
     <div class="produto">
       <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT7M8PLhldKqVoKPIt29IzSuMz3luvTMGiaTQ&s" width="200" height="200" alt="Produto 1">
       <h3>Lápis Escolar</h3>
       <p>Descrição: Lápis para material escolar </p>
       <p>Preço: R$1,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://st2.depositphotos.com/1875497/11825/i/450/depositphotos_118252994-stock-photo-blank-notebook-on-white.jpg" alt="Produto 2">
       <h3>Caderno</h3>
       <p>descriçao: use para estudo :-)</p>
       <p>preço: R$29,99</p>
       <id>Caderno</id>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLanm-_vEAx-UsCIMGQ7H7M7flCnSk_zQ5zw&s" alt="Produto 3">
       <h3>Caderno de Artes</h3>
       <p>Descrição: Caderno sem pauta para artes escolar</p>
       <p>Preço: 29,90</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://us.123rf.com/450wm/domnicky/domnicky2104/domnicky210400053/167177146-red-and-blue-eraser-isolated-on-a-white-background-rubber-pencil-and-ink-eraser.jpg" alt="Produto 4">
       <h3>Borracha</h3>
       <p>Descrição: Borracha branca </p>
       <p>Preço: 5,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSy-1SzbcnB4BKU9hf1gP1wfbIbrNh3OlCBQQ&s" alt="Produto 5">
       <h3>Folha Papel A4 </h3>
       <p>Descrição: 50 Unidades folha branca papel A4</p>
       <p>Preço: 35,99</p>
     </div>
  </button>
  <button>
     <div class="produto">
       <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT4_k8nlDSQSoz-N1UUjEg4txFPUANLXGFgOA&s" alt="Produto 6">
       <h3>Corretivo Líquido</h3>
       <p>Descrição: Corretivo líquido 18 ml</p>
       <p>Preço: 9,99</p>
     </div>
  </button>
  <button>
    <div class="produto">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcROWiK6JKm1Qjrag3oRAQ4fVfrUro2xGYwptw&s" alt="Produto 7">
      <h3>caderno decorado</h3>
      <p>Descrição: e um caderno com decoraçao</p>
      <p>Preço: R$34,99</p>
    </div>
  </button>
  <button>
    <div class="produto">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBdXcs4q5mJ37kmvPRVi_OlV7eYx1APt-7_Q&s" alt="produto 8">
      <h3>Tank escolar</h3>
      <p>Descrição: Um transporte seguro ate a escola</p>
      <p>Preço: R$863.427,60</p>
    </div>
  </button>  
  <button>
    <div class="produto">
      <img src="https://cdn.awsli.com.br/600x450/1358/1358824/produto/230341128/eses-0215-1-j2ai2ygr8z.jpg">
      <h3>corretivo de fita</h3>
      <p>Descrição: corretivo em fita 5m x 5mm</p>
      <p>Preço: <R1>R$7,69</R1></p>
    </div>
  </button> 
</form>
</body>
</html>
